# Space365 vhost — space365.tpgarchitecture.com
# TLS via the wildcard *.tpgarchitecture.com cert (renews Jan 2027).
server {
    listen 80;
    server_name space365.tpgarchitecture.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name space365.tpgarchitecture.com;

    ssl_certificate     /etc/ssl/space365/wildcard_tpgarchitecture.crt;
    ssl_certificate_key /etc/ssl/space365/wildcard_tpgarchitecture.key;
    ssl_trusted_certificate /etc/ssl/space365/wildcard_tpgarchitecture.ca;

    # Static world client (vite build output)
    root /var/www/space365;
    index index.html;
    location / {
        try_files $uri /index.html;
    }

    # Graph change-notification webhook -> ingest service.
    # Graph requires fast ACK; no buffering.
    location /api/graph/webhook {
        proxy_pass http://127.0.0.1:8787;
        proxy_buffering off;
        proxy_read_timeout 15s;
    }
    location /healthz {
        proxy_pass http://127.0.0.1:8787;
    }

    # SpacetimeDB WebSocket + HTTP API for browser clients.
    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Front-channel logout target registered in Entra.
    location /logout/ {
        try_files /logout.html =404;
    }
}
