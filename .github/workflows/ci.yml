name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node (required by spacetime TS build)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests (schema, layout, sim blueprint, ingest units)
        run: |
          bun install
          bun test tests --timeout 20000

      - name: Module typecheck
        working-directory: spacetime/module
        run: |
          bun install
          bunx tsc --noEmit

      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com -o /tmp/stdb-install.sh
          bash /tmp/stdb-install.sh --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish module to ephemeral local server + parity tests
        run: |
          spacetime start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/v1/ping && break || sleep 1
          done
          if [ -d tests/parity ]; then
            bun test tests/parity --timeout 120000
          else
            spacetime publish space365ci --server local --yes --module-path spacetime/module
          fi
